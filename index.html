body.nav-collapsed .layout{grid-template-columns:0 minmax(390px,1fr) minmax(320px,.86fr)}body.nav-collapsed .nav{width:0;padding:0;border:0;overflow:hidden}body.explanation-collapsed .layout{grid-template-columns:220px minmax(390px,1fr) 0}body.explanation-collapsed .panel{width:0;padding:0;border:0;overflow:hidden}body.nav-collapsed.explanation-collapsed .layout{grid-template-columns:0 minmax(390px,1fr) 0}.layout,.nav,.panel{transition:grid-template-columns .2s,width .2s,padding .2s}
.hover-card{position:fixed;z-index:60;width:min(440px,calc(100vw - 30px));max-height:48vh;overflow:auto;background:var(--paper2);border:1px solid var(--gold);border-radius:12px;padding:17px 19px;box-shadow:0 16px 46px rgba(45,30,10,.22);font:400 15px/1.75 var(--serif);display:none}.hover-card.visible{display:block}.hover-card strong{display:block;color:var(--gold);margin-bottom:7px;font-size:13px}.scroll-reader{display:none;padding:40px clamp(25px,5vw,74px) 110px;max-width:900px;margin:auto}.scroll-view .reader,.scroll-view .panel{display:none}.scroll-view .layout{display:block}.scroll-view .nav{position:fixed;left:0;width:220px}.scroll-view.nav-collapsed .nav{width:0}.scroll-view .scroll-reader{display:block}.scroll-section{padding:34px 0 52px;border-bottom:1px solid var(--line);scroll-margin-top:92px}.scroll-section h2{font:700 30px var(--serif);letter-spacing:.1em;margin:0 0 22px}.scroll-section .sutra{font-size:20px}.scroll-translation{margin-top:20px;padding:20px 24px;background:rgba(255,253,248,.75);border-left:2px solid var(--gold);font:400 16px/1.85 var(--serif);color:#554d40}
@media(max-width:1160px){.shortcut-help{display:none}.brand small{display:none}.toolbar{gap:4px}.tool{padding:7px 8px}.search{width:min(210px,22vw)}}
@media(max-width:800px){.toolbar .wide-only,.view-switch{display:none}body.nav-collapsed .layout,body.explanation-collapsed .layout,body.nav-collapsed.explanation-collapsed .layout{display:block}.hover-card{font-size:14px}.scroll-view .nav{top:60px}.scroll-reader{padding:28px 22px 80px}.scroll-section h2{font-size:25px}}

<script>
const chapters=[{"title":"法會因由分第一","original":"如是我聞：一時，佛在舍衛城祇樹給孤獨園，與大比丘眾千二百五十人俱。爾時，世尊食時，著衣持缽，入舍衛大城乞食。於其城中次第乞已，還至本處。飯食訖，收衣缽。洗足已，敷座而坐。","translation":"阿難說：這部金剛般若波羅蜜經是阿難我聽如來佛親口所講的，佛在講這部經的時候，是在舍衛城名叫「祈樹給孤獨園」這個地方，當時佛陀與有德性的羅漢、菩薩以及其他弟子，共有一千二百五十人共同聚在一起，到了快要吃飯的時候，大夥兒就穿上了袈裟，手裏拿著盛飯的缽，由祈樹給孤獨園走到舍衛大城去乞食。在城裏不分富貴貧賤，挨家挨戶的乞食，乞食完畢就回到原來祈樹給孤獨園的地方吃飯。吃完飯，就把袈裟及缽收好，也把腳洗乾淨，再把作位鋪好，然後坐了下來。"},{"title":"善現啟請分第二","original":"時長老須菩提在大眾中，即從座起，偏袒右肩，右膝著地，合掌恭敬。而白佛言：「希有！世尊。如來善護念諸菩薩，善付囑諸菩薩。世尊！善男子、善女人，發阿耨多羅三藐三菩提心，云何應住？云何降伏其心？」佛言：「善哉！善哉！須菩提！如汝所說，如來善護念諸菩薩，善付囑諸菩薩。汝今諦聽，當為汝說。善男子、善女人，發阿耨多羅三藐三菩提心，應如是住，如是降伏其心。」「唯然！世尊！願樂欲聞。」","translation":"這個時候，有位德高年長的佛陀弟子名叫「須菩提」，他在大眾中從自己的座位站了起來。露出右肩【因為印度人平常衣服是遍覆全身，要禮佛時才袒露右肩，以示恭敬】右膝跪地【印度的禮儀有兩種，禮拜時雙膝跪地，懺悔及請法是右膝跪地，表是順理誠心】而且恭恭敬敬的向佛陀合掌行禮，然後讚嘆說：「希有的世尊，您對於已發善心而未成就佛圓滿境界的弟子，善護眷念他們的善心，又善於咐囑使他們心靈能夠圓滿。世尊！當善男子、善女人，在發起無上正等正覺菩提心的時候，要怎樣使這個菩提心常住不退？以及若是起了妄想執著心的時候，又怎樣去降服這個妄想執著心呢？」佛陀回答說：「問得好！問得好！須菩提！如同你所說的，對於已發善心而未成就佛圓滿境界的弟子，如來我善護眷念他們的善心，又善於咐囑使他們心靈能夠圓滿。所以我當然要為你們解說，你們仔細聽著，發心修行的善男子、善女人在發菩提心的時候，就是已流露出真如的本性，就應該這樣常住這個真心，就應該這樣降伏一切的妄念」須菩提聽完佛陀開示後說：「是的！世尊！願聽師父說說這個道理」"},{"title":"大乘正宗分第三","original":"佛告須菩提：「諸菩薩摩訶薩，應如是降伏其心：所有一切眾生之類─若卵生、若胎生、若濕生、若化生；若有色、若無色；若有想、若無想；若非有想非無想，我皆令入無餘涅槃而滅度之。如是滅度無量無數無邊眾生，實無眾生得滅度者。何以故？須菩提！若菩薩有我相、人相、眾生相、壽者相，即非菩薩。」","translation":"佛陀於是告訴須菩提說：「諸位大菩薩，在修行當中，應該按照下面的方法降伏妄想心，才能常住菩提心，降伏妄心的方法就是所有的眾生好比說【一】孵卵所生的雞、鴨、麻雀、鴿子。【二】母胎所生的人、羊、牛、馬。【三】水中或潮濕中所生的魚、蝦、鱉、蟹。【四】蛻化所生蠶、飛蛾、蒼蠅、蚊子﹝他們都是由幼蟲蛻變而化成﹞。【五】有色眾生；他們由五蘊﹝色蘊、受蘊、想蘊、行蘊、識蘊，蘊是障蔽的意思﹞組成的，有色眾生居住在慾界及色界。【六】無色眾生，他們由四蘊﹝受蘊、想蘊、行蘊、識蘊﹞組成的，無色眾生居住在無色界中。【七】有思想的眾生，三界﹝慾界、色界、無色界﹞中除了無想天之外，都是有思想的眾生。【八】無思想的眾生，他們是專修無想的外道修士，也就是外道的最高果位，居住在色界的無想天中。【九】非有想非無想的眾生，他們居住在三界最高的是非想非非想天，這裏的眾生沒有粗想但仍有細想，所以是非有想非無想。以上九種眾生所產生的妄心，都不是菩薩的真心，各位要慈悲救渡他們，使他們達到沒有執著清淨解脫的境界，雖然有那麼多的眾生受到渡化，自我心中絕不執著眾生是我所度化的念頭。為什麼呢？須菩提！你要知道如果菩薩還有我相﹝對於自我的意念執著﹞、人相﹝人我的對待意念﹞、眾生相﹝自以為是為眾生求永生、為眾生服務以及認為對方是因為執著或業力所受生﹞、壽者相﹝執著長壽、永生﹞，他就不是菩薩了。"},{"title":"妙行無住分第四","original":"復次：「須菩提！菩薩於法，應無所住，行於布施。所謂不住色布施，不住聲、香、味、觸、法布施。須菩提！菩薩應如是布施，不住於相。何以故？若菩薩不住相布施，其福德不可思量。須菩提！於意云何？東方虛空可思量不？」「不也，世尊！」「須菩提！南、西、北方、四維、上、下虛空，可思量不？」「不也。世尊！」「須菩提！菩薩無住相布施，福德亦復如是，不可思量。須菩提！菩薩但應如所教住！」","translation":"佛再對須菩提說：「菩薩對於成就無上正等正覺之法，在於布施時應該沒有執著的，在做出利益眾生的事情之後，也不會有絲毫的執著。所謂不著相布施，在於內德方面必須做到六根清淨，離開色、聲、香、味、觸、法等內心的塵相而行布施。並且菩薩行布施之後要做到忘記我布施給誰，我是用什麼布施，以及是我所做的布施。為什麼呢？因為著相布施，心中所著的相體；與無量無邊際的虛空來比較，實在只是一微塵，即使能因此而獲福也是有限的。若不著相布施，內心就能與虛空相呼應，像這樣不住相布施的福德就不可限量了。佛問須菩提，你的看法怎樣？譬如東方那無邊際的虛空，你可以用心去思索或實際測量出有多大嗎？」須菩提回答世尊說：「不可以」佛又問須菩提說：「再與南、西、北四方及上下毫無邊際的虛空，你是否可以用心去思索或實際測量出有多大嗎？」須菩提回答世尊說：「不可以」佛又說：「須菩提！菩薩若能不著相布施，所得的福德也就像虛空那樣的廣大難以想像，不可測量。佛告訴須菩提！菩薩應該照我所講的去修行以及去教導眾生」"},{"title":"如理實見分第五","original":"「須菩提！於意云何？可以身相見如來不？」「不也，世尊！不可以身相得見如來。何以故？如來所說身相，即非身相。」佛告須菩提：「凡所有相，皆是虛妄。若見諸相非相，即見如來。」","translation":"佛說：「須菩提你的意思怎麼樣？可以執著這個有形的色身相來見到佛的本體嗎？」須菩提回答世尊說：「那是不可以的，不可以執著色身相來見到佛的本體。為什麼呢？因為佛陀您所說的這個有形色身相，它是會隨因緣而變化，它是沒有自主性的」。佛陀聽了告訴須菩提說：「不但我有形體的身相是這樣，世間一切有形體的東西也是一樣，都會隨因緣而變化，都會毀壞，所以可以說都是虛幻的假相，所以世人如果能夠識破諸相皆是虛幻的道理，就可以了悟如來的法相了。"},{"title":"正信希有分第六","original":"須菩提白佛言：「世尊！頗有眾生，得聞如是言說章句，生實信不？」佛告須菩提：「莫作是說！如來滅後，後五百歲，有持戒修福者，於此章句，能生信心，以此為實。當知是人，不於一佛、二佛、三四五佛而種善根，已於無量千萬佛所種諸善根。聞是章句，乃至一念生淨信者；須菩提！如來悉知悉見，是諸眾生得如是無量福德。何以故？是諸眾生，無復我相、人相、眾生相、壽者相、無法相，亦無非法相。何以故？是諸眾生若心取相，即為著我、人、眾生、壽者。若取法相，即著我、人、眾生、壽者。何以故？若取非法相，即著我、人、眾生、壽者。是故不應取法，不應取非法。以是義故，如來常說：汝等比丘！知我說法，如筏喻者；法尚應捨，何況非法？」","translation":"須菩提聽完之後又向佛陀說：「世尊！您所說的不住相布施，以及所謂見諸相非相即見如來，這種無相真空的妙理，眾生聽了會生起真實的信念嗎？」如來佛聽了就告訴須菩提說：「你不必懷疑。雖然我所說的佛法非常深妙，但是仍然會有人深信不疑，不但現在有人相信，即使等到我死後兩千年，仍然有持守戒律，廣修福田的善男信女，聽到此經中的任何一章或是一句，不但非常相信，並且認為真實。要知道這種人善根深厚，不僅是在最近世諸佛，修學佛法所種的善根，甚至是從過去無量佛那裏種來的善根。所以他們聽到或看到此經中的任何一章或是一句，就能一心清淨誠信。佛告訴須菩提說：如來我以佛的慧眼佛眼，動悉這些淨信眾生內心是通達佛性的，可以得到如虛空般無量福德。這是什麼緣故呢？因為這些眾生善根純熟，已悟得真空無相的道理，已離開我相﹝對於自我的意念執著﹞、人相﹝人我的對待意念﹞、眾生相﹝自以為是為眾生求永生、為眾生服務以及認為對方是因為執著或業力所受生﹞、壽者相﹝執著長壽、永生﹞；更不會執著一切萬法《因為一切萬法只是度化眾生的心靈到達彼岸的工具而已，而本性才是佛，萬法並非佛性，當我們了悟了我們佛性時，萬法都必須放下》，以及執著法空的名相《若執著於萬法皆空，內心也是有一個萬法空相的執著存在》因為眾生心中如果對於任何的相有所執取，便是在內心深處產生了我相、人相、眾生相、壽者相的執著。所以如果心執著萬法的名相，便會在內心深處產生我相、人相、眾生相、壽者相的執著；相同的道理，如果心理執著法空的名相，在內心深處也是產生我相、人相、眾生相、壽者相的執著。所以不要執著一切萬法，也不要執著法空，才能悟入性空，就因為這個原因，所以我為你們說法的時候，常用竹筏來做比喻，世人編竹為茷，渡人過河，到了彼岸竹筏就不須要再用了。我所說的佛法，就像渡人過河的竹筏一樣，過了河就要放棄，何況是法空的執著更應放下」"},{"title":"無得無說分第七","original":"「須菩提！於意云何？如來得阿耨多羅三藐三菩提耶？如來有所說法耶？」須菩提言：「如我解佛所說義，無有定法，名阿耨多羅三藐三菩提；亦無有定法如來可說。何以故？如來所說法，皆不可取、不可說；非法、非非法。所以者何？一切賢聖，皆以無為法，而有差別。」","translation":"佛問須菩提說：「你的看法如何？如來真的有所得無上正等正覺的菩提嗎？如來為眾生說各種教法，但在如來的心中是否執著有所說法的念頭呢？」須菩提回答說：「就我所理解佛所說的義理，因每個人開悟的因緣不一樣，所以要使眾生開悟是沒有一定的法。並且如來所說一切，都是由自性本體自然流露出來的，是應眾生的機緣而說，沒有執著一定的法。為什麼呢？因為如來所說的法，是要眾生了悟佛性清靜本體，所以不可對於相或對於法有所執著，也不可執著口舌言說；不可執著法，也不可執著頑空。為什麼這樣呢？因為一切賢聖都是由這個無為法自修。只是隨各人所修領悟的程度不同，自性清淨心流露的多寡也就有所不同，所證悟程度就有所差別。」"},{"title":"依法出生分第八","original":"「須菩提！於意云何？若人滿三千大千世界七寶，以用布施。是人所得福德，寧為多不？須菩提言：「甚多。世尊！何以故？是福德，即非福性。是故如來說福德多。」「若復有人，於此經中，受持乃至四句偈等，為他人說，其福勝彼。何以故？須菩提！一切諸佛，及諸佛阿耨多羅三藐三菩提法，皆從此經出。須菩提！所謂佛法者，即非佛法。」","translation":"佛說：「須菩提！如果有人以充滿三千大千世界的金銀七寶來行布施，你認為這個人所得的福德是不是很多？」須菩提回答世尊說：「當然是很多。為什麼呢？因為這只是世間福德《福報》，世間的福報是可以用多少來衡量的，這跟我們自性中無形無相不能細數無量清靜的福德完全沒有關係。然而就以人世間著相布施所得福報而言，如來說這個人所得的福德多。」如來佛又說：「如果有人，受持這整部般若經，或者少到只是以其中的四句偈等，不但使自己了悟清靜，也宣說使別人能夠了悟清靜，那麼他所得到的福德，比前面說的用三千大千世界的七寶布施所得福德來得更為殊聖。為什麼呢？須菩提！因為一切諸佛，及成佛的無上正等正覺菩提法，皆從此般若經緣生的。須菩提！所謂佛法的目的在於引導眾生由迷失返回覺悟，不得已所取的假名，當覺悟的時候，佛法也不需要了」"},{"title":"一相無相分第九","original":"「須菩提！於意云何？須陀洹能作是念，我得須陀洹果不？」須菩提言：「不也。世尊！何以故？須陀洹名為入流，而無所入；不入色、聲、香、味、觸、法。是名須陀洹。」「須菩提！於意云何？斯陀含能作是念，我得斯陀含果不？」須菩提言：「不也。世尊！何以故？斯陀含名一往來，而實無往來，是名斯陀含。」「須菩提，於意云何？阿那含能作是念，我得阿那含果不？」須菩提言：「不也。世尊！何以故？阿那含名為不來，而實無不來，是故名阿那含。」「須菩提！於意云何？阿羅漢能作是念，我得阿羅漢道不？」須菩提言：「不也。世尊！何以故？實無有法名阿羅漢。世尊！若阿羅漢作是念，我得阿羅漢道，即為著我、人、眾生、壽者。世尊！佛說我得無諍三昧，人中最為第一，是第一離欲阿羅漢。世尊！我不作是念：『我是離欲阿羅漢。』世尊！我若作是念，我得阿羅漢道，世尊則不說須菩提是樂阿蘭那行者，以須菩提實無所行，而名須菩提，是樂阿蘭那行。」","translation":"佛說：「須菩提，你的意思怎樣？一個修行者如果還不能達到頓悟真空的境界，但能強制他的欲望，使六塵之相不能進入他的心靈，也就是修行境界上所稱聲聞初果的聖者，會有我已證得聲聞初果的想法嗎？」須菩提回答世尊說：「不可以的，為什麼呢？因為證得聲聞初果的修行人，雖然已進入聖人之流，但證得聲聞初果的修行人，內心是不執著已證得聲聞初果。而且也不執著艷麗的美色、悅耳的聲音、香濃的美味、可口的食物、舒服的觸感以及一切萬法，所以才能稱得上已證得聲聞初果的聖者。」佛陀又說：「須菩提！你的意思怎樣？已證得聲聞第二果的聖者，能起這樣的念頭，我已證聲聞第二果的想法嗎？」須菩提回答世尊說：「不可以的！為什麼呢？因為證得證聲聞第二果的修行人，內心的境界雖然已達到至為寧靜，可是他的心與外接觸時還是會產生一生一滅的現象，這種現象我們稱它為「一往來」，雖然他的心還會產生一生一滅的現象，但是他們不會因此而產生第二個生滅的念頭，也就是在前念生起的時候，後念就已經自然化解掉了，心不執著生滅的相，這才是真正的證得證聲聞第二果的修行人」。佛又問須菩提說：「你的意思怎樣？已證得聲聞第三果的修行人，能起這樣的念頭，我已證聲聞第三果的想法嗎？」須菩提回答世尊說：「不可以的！為什麼呢？因為證得第三果的修行人，能處在各種現象中，心中已達到無我的境界，更沒有塵識思惑及欲望，這才是真正證得聲聞第三果的修行人。佛又問須菩提說：「你的意思怎樣？證得阿羅漢果的聖者，會有我已得阿羅漢果的想法嗎？」須菩提回答世尊說：「不會的，不會起這樣的想法。為什麼呢？因為在阿羅漢心中一切相與法早已俱滅所以才稱為阿羅漢。假使證得阿羅漢果位的聖者，會有我有得阿羅漢果的想法，那麼他的心中已執著我相﹝對於自我的意念執著﹞、人相﹝人我的對待意念﹞、眾生相﹝自以為是為眾生求永生、為眾生服務以及認為對方是因為執著或業力所受生﹞、壽者相﹝執著長壽、永生﹞，那他就已經遠離阿羅漢的境界了。世尊！您曾經這樣讚許過我，讚許我無爭競之心已到精妙處，讚許我在諸弟子中為解空第一，達到第一修行離欲功夫的阿羅漢。世尊！我雖蒙師父您如此的稱讚，但我仍然默默的修持，從來沒有我已證得了離欲阿羅漢的念頭。世尊！如果我有得了阿羅漢的念頭，便是產生妄念，如何證得六欲皆空的阿羅漢。如果是這樣，佛陀您就不會說我是好於寂靜的修行人，就因為我心無所得，也無所失，不執著一切相，行而不執著行，一切無欲無求，所以師父您才稱讚我是好寂靜的修行人」。"},{"title":"莊嚴淨土分第十","original":"佛告須菩提：「於意云何？如來昔在然燈佛所，於法有所得不？」「不也，世尊！如來在然燈佛所，於法實無所得。」「須菩提！於意云何？菩薩莊嚴佛土不？」「不也。世尊！何以故？莊嚴佛土者，即非莊嚴，是名莊嚴。」「是故，須菩提！諸菩薩摩訶薩，應如是生清淨心，不應住色生心，不應住聲、香、味、觸、法生心，應無所住，而生其心。須菩提！譬如有人，身如須彌山王，於意云何？是身為大不？」須菩提言：「甚大。世尊！何以故？佛說非身，是名大身。」","translation":"佛說：「須菩提！你認為以前如來我在與然燈佛會晤時，從他那兒有沒有得到什麼成佛之法？」須菩提回答世尊說：「您當初在與然燈佛會晤時，實在沒有從他那裏得到什麼成佛之法，因為佛性是要自悟才能自度」。佛又問須菩提說：「你認為菩薩執著有形有相的佛土莊嚴嗎？」須菩提回答世尊說：「不是這樣的，為什麼呢？因為你所說莊嚴佛土的意思，是回到清靜佛性本體，不是執著在形相上的莊嚴，」佛又說：「就因為如此，須菩提！所以成就的大菩薩們應該像這樣一心不亂，生清淨心，不可執著在色、聲、香、味、觸、法之上產生意念。否則便受六塵所蒙蔽、束縛，妄念旋起，心怎麼能清淨呢？所以我們應該生發出無所執著的心。須菩提！譬如有人，他的身體像須彌山王那麼大，你認為他的身體形狀是不是很大？」須菩提回答世尊說：「非常大。但是這個人身體形狀雖然很大，但不能稱為大身。為什麼呢？因為他的身形再大，也是有生滅；而師父您說的是非形相真身﹝自性﹞，此真身包太虛、周法界、無住無相，哪裡是有形的須彌山所能比擬的呢？這才是真正能稱為大身。」"},{"title":"無為福勝分第十一","original":"「須菩提！如恆河中所所沙數，如是沙等恆河，於意云何？是諸恆河沙，寧為多不？」須菩提言：「甚多。世尊！但諸恆河，尚多無數，何況其沙？」「須菩提！我今實言告汝，若有善男子、善女人，以七寶滿爾所恆河沙數三千大千世界，以用布施，得福多不？」須菩提言：「甚多。世尊！」佛告須菩提：「若善男子、善女人，於此經中，乃至受持四句偈等，為他人說，而此福德，勝前福德。」","translation":"佛說：「須菩提！如用恒河中所有的沙數來作比喻，以一粒沙比喻為一條恒河，那麼所有恒河內的所有沙，你認為多或是不多呢？」須菩提回答世尊說：「非常多。以每粒沙各代表一條恒河，河尚且就有無數多，何況是所有河中沙的數量！」佛又說：「須菩提，我實在告訴你，如果有想修習佛道的男女，以一粒沙當作一個世界，用充滿如恒河沙數量那麼多的三千大千世界的七寶來布施，那他所得的福德是不是很多？」須菩提回答世尊說：「當然很多」佛又告訴須菩提說：「如果有想修習佛道的男女，為他人演說此經，甚至只是四句偈等，這個法施所得的福德比前面用無數七寶布施所得的福德來得殊聖。」"},{"title":"尊重正教分第十二","original":"復次：「須菩提！隨說是經，乃至四句偈等，當知此處，一切世間天、人、阿修羅，皆應供養，如佛塔廟。何況有人，盡能受持、讀誦。須菩提！當知是人，成就最上第一希有之法；若是經典所在之處，即為有佛，若尊重弟子。」","translation":"佛再進一步的說：「須菩提！如果有人在任何地方，講解這整部經點，甚至只有講解其中的四句偈等，使那些聽講經的人妄念消除，了悟佛性。應當知道此一講經的地方，一切天道的菩薩神明、人道的眾生、阿修羅道的惡魔，都應該恭敬供養，作禮散花，好像供養佛的塔廟一樣。更何況是有人能夠受持讀誦這本般若經典以求領悟。須菩提！你可知這種人能成就世上第一希有的無上菩提法。因為這部經典是佛陀講述，讓世人了悟本身自性的一部經典，所以這部經典所在的地方，就好像有佛在那裏，並且我們要對修持讀誦這部金剛經的人，也像尊重佛的弟子一樣尊重」。"},{"title":"如法受持分第十三","original":"爾時，須菩提白佛言：「世尊！當何名此經？我等云何奉持？」佛告須菩提：「是經名為金剛般若波羅蜜，以是名字，汝當奉持。所以者何？須菩提！佛說般若波羅蜜，即非般若波羅蜜，是名般若波羅蜜。須菩提！於意云何？如來有所說法不？須菩提白佛言：「世尊！如來無所說。」「須菩提！於意云何？三千大千世界所有微塵，是為多不？」須菩提言：「甚多。世尊！」「須菩提！諸微塵，如來說非微塵，是名微塵。如來說世界非世界，是名世界。須菩提，於意云何？可以三十二相見如來不？」「不也。世尊！不可以三十二相得見如來。何以故？如來說三十二相，即是非相，是名三十二相。」「須菩提！若有善男子、善女人，以恆河沙等身命布施，若復有人，於此經中，乃至受持四句偈等，為他人說，其福甚多！」","translation":"那個時候，須菩提向佛陀請教：「世尊！此部經應該取什麼名字？以及我們應該怎樣受持奉行此經典？」佛就告訴須菩提說：「這部經就取名為金剛般若波羅蜜，也就是要以至高無上的妙智慧到達彼岸，這個名字有無上的意義存在，所以你們應當恭敬護持。為什麼取這個名字呢？須菩提！我所說的般若波羅蜜，是妙覺本性，此妙覺本性空如太虛。本體既然是虛無，那裡還會有什麼名字。不過恐怕人生斷見，以及為便於眾弟子奉持不得已勉強取這個『金剛般若波羅蜜』的名稱，。佛問須菩提！你認為我有所說法嗎？」須菩提回答世尊說：「覺悟的本性已經是脫離言說、文字、形相的執著，所以世尊在您心中並沒有“自己有所說法”的念頭。」佛又說：「須菩提！你認為三千大千世界裡所有的微塵是不是很多？」須菩提回答世尊說：「非常多」佛又說：「須菩提！微塵雖然是很多，但是都沒有自主性，都是因為因緣而有，也會因為因緣而散失，一切只是幻化而已，所以說是非微塵，只不過假藉一個名稱，稱它是微塵。同樣的道理，我說世界雖然廣大，也是沒有自主性，會因為因緣而毀壞，所以它也是虛空不實的，為了方便言說，不得已假藉一個名稱，稱它是世界。」佛又問須菩提說：「你認為可以用佛的莊嚴三十二外表相得見如來本體嗎？」須菩提回答說：「不可以，世尊！不可以用佛的三十二莊嚴外表相見到如來本體。為什麼呢？因為您所說的三十二相，是屬於因緣假合所現的短暫現象，他根本沒有實在可自主的相存在，所以他也是假藉的名稱，稱它為三十二相。」佛又再提醒說：「須菩提！若有善男子或善女人，以恒河沙那麼多相等數量的生命來布施眾生，以犧牲生命來布施以求福德。再說假如有另一種人，受持講說此整部經典，甚而少到只以此經中四句偈等深體領悟為別人演說，讓眾生能夠了悟自身佛性，他持經布施所得的福，比前面說的捨身布施所得的福更多。」"},{"title":"離相寂滅分第十四","original":"爾時，須菩提聞說是經，深解義趣，涕淚悲泣，而白佛言：「希有！世尊。佛說如是甚深經典，我從昔來所得慧眼，未曾得聞如是之經。世尊！若復有人得聞是經，信心清淨，即生實相。當知是人成就第一希有功德。世尊！是實相者，則是非相，是故如來說名實相。世尊！我今得聞如是經典，信解受持不足為難，若當來世後五百歲，其有眾生，得聞是經，信解受持，是人則為第一希有。何以故？此人無我相、人相、眾生相、壽者相，所以者何？我相，即是非相；人相、眾生相、壽者相，即是非相。何以故？離一切諸相，則名諸佛。」佛告須菩提：「如是，如是！若復有人，得聞是經，不驚、不怖、不畏，當知是人，甚為希有。何以故？須菩提！如來說第一波羅蜜即非第一波羅蜜，是名第一波羅蜜。須菩提！忍辱波羅蜜，如來說非忍辱波羅蜜，是名忍辱波羅蜜。何以故？須菩提！如我昔為歌利王割截身體，我於爾時，無我相、無人相、無眾生相，無壽者相。何以故？我於往昔節節支解時，若有我相、人相、眾生相、壽者相，應生瞋恨。須菩提！又念過去於五百世，作忍辱仙人，於爾所世，無我相、無人相、無眾生相、無壽者相。是故，須菩提！菩薩應離一切相，發阿耨多羅三藐三菩提心，不應住色生心，不應住聲、香、味、觸、法生心，應生無所住心。若心有住，即為非住。是故佛說菩薩心，不應住色布施。須菩提！菩薩為利益一切眾生故，應如是布施。如來說一切諸相，即是非相；又說一切眾生，即非眾生。須菩提！如來是真語者、實語者、如語者、不誑語者、不異語者。須菩提！如來所得此法，此法無實無虛。須菩提！若菩薩心住於法，而行布施，如人入闇，則無所見。若菩薩心不住法，而行布施，如人有目日光明照，見種種色。須菩提！當來之世，若有善男子、善女人，能於此經受持、讀誦，則為如來，以佛智慧，悉知是人，悉見是人，皆得成就無量無邊功德。」","translation":"那時，須菩提聽如來佛說到這裡，心中已經深悟佛理，感動的流下淚來。不禁向如來佛讚嘆了一聲：「希有的世尊！您所說這個深奧的經典，即使在從前，我雖具有慧眼，也能一聞千悟，卻是未曾聽得如此深奧的經。我既聞此經，自性清淨中，已悟本有全真的實相。如果有人，聞得此經，發出篤信之心、純正清淨之心，毫無塵念，而達到心即是佛的實在本相，可知道這種人，是成就第一希有功德的人。但是，世尊！究竟這般若實相，不是一般所說有形的東西，這般若實相，空如太虛、沒有行跡，但為引導眾生離開執著而找回本心，不得不假藉一個名稱，稱之為實相，修持證悟的人仍然不可執著。世尊，此經我聽到這裡，已能了解其中的妙理，信奉修持，應該不是難事。倘若佛陀您圓寂兩千年之後，離開師父您住世說法時期已久遠的茫茫苦海眾生，聽到此經而能信解受持的人，實在是太難得了。為什麼呢？因為這個人頓悟真空，必無我相、人相、眾生相、壽者相，就因為他已經了悟我相、人相、眾生相、壽者相是非實有的相，而是由內心執著而來，所以能夠離一切相，他的心達到覺悟空寂的境地，這個內心的境地與諸佛並駕齊驅，可以稱為佛的境地。」佛告訴須菩提說：「你說對了！你說對了！當知後世如果有人，聽到般若之妙法而內心不產生驚駭〈即不會認為言之過也〉、畏懼〈恐道之高也〉、退縮〈怯行之難也〉，而內心達到虛空平靜，這種人實在是很少有的。為什麼呢？須菩提！我現在所說第一捷徑到達彼岸的方法，也就是以妙智慧破除煩惱而得解脫的方法，我把它稱為第一波羅蜜，但你們仍然不可執著第一波羅蜜這個法、這個名相，因為一切法、一切名相，只是為了引導眾生修持，而自性的本體是虛寂靈明的。須菩提！再說到忍辱波羅蜜，凡辱境之來，恬然處之，其心如同太虛，內不見其忍，外不見其辱就是忍辱波羅蜜，只是為便於示導眾生，不得已給予一個名稱，稱它為忍辱波羅蜜。為什麼呢？須菩提！就好比我的前生，被歌利王支解身體的時候，那時我心如虛空，無我相、人相、眾生相、壽者相，否則當時我在被支解時，如果著此四相，必定生忿恨心。須菩提，我又想起過去五百世前，做忍辱仙人修忍辱之行時，就已經沒有我人眾生壽者四相。所以說，須菩提！菩薩之修行，首當空其心，離一切相，方能發無上正等正覺的菩提心。此心中不執著於色，不執著於聲、香、味、觸、法，要做到心無所住，此心才能圓通無礙。若於六塵中，一有執著，心便不能解脫，即非菩薩的住處。所以我說，菩薩心本來是虛而明，若執著於六塵就不能覺悟，我所謂的不應住色布施，原因就在於此。須菩提！菩薩不住色布施，發心廣大，不是為己，自然有利於一切眾生，應該要如此無相布施。而我所說的一切諸相，其真實的本體皆是空的，原是非相。而一切眾生，如果能夠見本性，妄心自離而入佛境，那麼一切眾生也就不是眾生了。須菩提！我一向是講真話的、講實話的、而且是永恆不變的真理，我從來不說欺騙的話，也不說怪異的話。須菩提！如來對於法是不執著有也不執著空。須菩提！如果菩薩心執著於法而行布施，對於真理的體悟，就好像人進入黑暗的房子裏面，什麼東西都看不見。如果菩薩心不執著於法而行布施，就好像人張開眼睛，看見日光四照，以及種種顏色。須菩提！當我去世後，如果有善男子或善女人，對於此經能夠受持讀誦身體力行，就能到達菩提的覺位，成就自性如來，我當然知道此人，也必定以無上智慧照鑒他。而此人成就見性的功德，是無量無邊的。」"},{"title":"持經功德分第十五","original":"「須菩提！若有善男子、善女人，初日分以恆河沙等身布施；中日分復以恆河沙等身布施；後日分亦以恆河沙等身布施，如是無量百千萬億劫，以身布施。若復有人，聞此經典，信心不逆，其福勝彼。何況書寫、受持、讀誦、為人解說。須菩提！以要言之，是經有不可思議，不可稱量，無邊功德，如來為發大乘者說，為發最上乘者說，若有人能受持、讀誦、廣為人說，如來悉知是人、悉見是人，皆得成就不可量、不可稱、無有邊、不可思議功德，如是人等，即為荷擔如來阿耨多羅三藐三菩提。何以故？須菩提！若樂小法者，著我見、人見、眾生見、壽者見，則於此經不能聽受、讀誦、為人解說。須菩提！在在處處，若有此經，一切世間，天、人、阿修羅所應供養，當知此處，則為是塔，皆應恭敬，作禮圍遶，以諸華香而散其處。」","translation":"佛說：「須菩提！若有善男子或善女人，於一天當中，早晨以相當於恒河沙那麼多數量的身體和生命布施，中午又以相當於恒河沙那麼多數量的身體和生命布施，晚上也以相當於恒河沙那麼多數量的身體和生命布施。照這樣子經百千萬億劫之久，每日都如此布施。但是如果有人聽聞此經，而能篤信且奉行不違逆，那麼他所得的福是從自性源源不斷的流露，勝過前面說的以身體和生命布施的人更來得無邊無際。更何況是手寫口誦、身體力行、為人解說此經的意義，不但自己明自己的自性，還使得人人見自本性。須菩提！簡而言之，因為內心奉行此經所得的功德是不可以用心思口議，不可以用多少來稱量，實在是無邊際的。佛為啟發大乘人，說此真空之妙；為啟發最上乘的人，說此般若之法。如有大慧根的人，內心信受奉持此大乘之法，廣為人闡發經義妙旨，如來我知曉這人，也能照見這人成就不可稱量、沒有邊際，不可思議的功德。這人既能成就如此功德，就足以能夠身擔任宣揚如來無上正等正覺的人。為什麼呢？因為如果是喜好執著於小乘法的人，因還有執著於我、人、眾生、壽者等私見，對此上乘之法，不能理解以及聽受讀誦，更不知如何為人解說此經。須菩提！無論在任何地方，如果有此部經典所在的地方，一切人、天、鬼神都應當齊來護衛供養。當知此經所在之處，就等於是佛塔所在的地方。都應該恭敬，作禮圍繞，並散布寶花妙香於此經所在之處。」"},{"title":"能淨業障分第十六","original":"復次：「須菩提！善男子、善女人，受持、讀誦此經，若為人輕賤，是人先世罪業，應墮惡道。以今世人輕賤故，先世罪業，則為消滅，當得阿耨多羅三藐三菩提。須菩提！我念過去無量阿僧祇劫，於然燈佛前，得值八百四千萬億那由他諸佛，悉皆供養承事，無空過者。若復有人，於後末世，能受持、讀誦此經，所得功德，於我所供養諸佛功德，百分不及一，千萬億分，乃至算數譬喻所不能及。須菩提！若善男子、善女人，於後末世，有受持、讀誦此經，所得功德，我若具說者，或有人聞，心則狂亂，狐疑不信。須菩提！當知是經義不可思議，果報亦不可思議。」","translation":"佛再進一步說明：「須菩提！如果有善男子或善女人，受持讀誦此經，不但不能得到世人恭敬，卻被世人所輕賤，原因是他累世所造的種種罪業，將來之世本來應該還要再墮入惡道中，受盡苦難。因他今世被人輕賤的緣故，前世所造的種種罪業就可以相互抵消。並且因為因除果現，罪滅福生，他所修持的般若妙智依然可以成就無上正等正覺。須菩提！我想到在歷經無量數劫之前。也就是在未遇然燈佛前，曾供養無量數佛，且沒有遺漏供養任何一尊佛。如果果後世之人能夠信受奉持以及讀誦此經，自然能見自本性，永離輪迴，他持經所得的功德，比我以前供佛的功德，遠勝百千萬億倍，以至於用算數或譬喻都無法表達。須菩提！若善男子或善女人於後末世，受持讀誦此經，必得無量的功德。此功德我如果要詳細說，恐怕慧根淺的人聽聞到，內心產生狂亂質疑不相信。如來佛又對須菩提說！當知這部經的經義與果報相當深遠，已經跳脫了一般世俗的思索。」"},{"title":"究竟無我分第十七","original":"爾時，須菩提白佛言：「世尊，善男子、善女人，發阿耨多羅三藐三菩提心，云何應住？云何降伏其心？」佛告須菩提：「善男子、善女人，發阿耨多羅三藐三菩提心者，當生如是心：我應滅度一切眾生；滅度一切眾生已，而無有一眾生實滅度者，何以故？須菩提若菩薩有我相、人相、眾生相、壽者相，則非菩薩。所以者何？須菩提！實無有法，發阿耨多羅三藐三菩提心者。須菩提！於意云何？如來於然燈佛所，有法得阿耨多羅三藐三菩提不？」「不也。世尊！如我解佛所說義，佛於然燈佛所，無有法得阿耨多羅三藐三菩提。」佛言：「如是！如是！須菩提！實無有法，如來得阿耨多羅三藐三菩提。須菩提！若有法如來得阿耨多羅三藐三菩提者，然燈佛即不與我授記：『汝於來世當得作佛，號釋迦牟尼。』以實無有法，得阿耨多羅三藐三菩提，是故然燈佛與我授記，作是言：『汝於來世，當得作佛，號釋迦牟尼。』何以故？如來者，即諸法如義。若有人言：如來得阿耨多羅三藐三菩提，須菩提！實無有法，佛得阿耨多羅三藐三菩提。須菩提！如來所得阿耨多羅三藐三菩提，於是中無實無虛。是故如來說一切法，皆是佛法。須菩提！所言一切法者，即非一切法，是故名一切法。須菩提！譬如人身長大。」須菩提言：「世尊！如來說人身長大，則為非大身，是名大身。」「須菩提！菩薩亦如是。若作是言：『我當滅度無量眾生。』則不名菩薩。何以故？須菩提！實無有法，名為菩薩。是故佛說：『一切法，無我、無人、無眾生、無壽者。』須菩提！若菩薩作是言：『我當莊嚴佛土。』是不名菩薩。何以故？如來說莊嚴佛土者，即非莊嚴，是名莊嚴。須菩提！若菩薩通達無我法者，如來說名真是菩薩。」","translation":"那時，須菩提當著機會又問佛說：「已經發菩提心的男女，應該如何安住這菩提心？以及如何降伏妄念呢？」佛聽了之後告訴須菩提說：「善男子、善女人要成就無上正等正覺，就應該自然散發這樣的心念，滅除度脫一切眾生的執著，使他們回歸到清靜的佛性，當滅除度脫一切眾生的執著後，我們的內心不能有任何一點眾生是我滅渡的念頭，為什麼呢？須菩提！一切眾生菩提心本來人人具足，只因眾生為塵俗所蒙蔽，所謂滅度，也必須是眾生自悟才能自渡，說到究竟，實無一眾生是我所滅度，外不見所渡的眾生，內不見能渡眾生的我。因為學道的菩薩，若執著我有滅度眾生之心，則尚存有人、我、眾生、壽者四相的執著，就不能稱為菩薩了，這是什麼原因呢？須菩提！原因是自性本是空寂，成就無上正等正覺的修行者，實在是不會執著有什麼可以發菩提心之法。」佛又問須菩提說：「你的意思怎樣？你認為我曾在然燈佛那裏得到能成就無上正等正覺的菩提法嗎？」須菩提回答世尊說：「沒有，根據我所了解世尊您所說的義理，世尊您在然燈佛那裏也是自性自悟，並不是有什麼法而使您證悟無上正等正覺。」佛陀聽了之後說：「是的！是的！須菩提！如來成就無上正等正覺，是在於心悟，實在沒有執著外在的法。須菩提！如果必須有法才能證得無上正等正覺，代表內心還有對法的執著，然燈佛就不會給我授記，因為內心沒有對法的執著，內心已達到究竟清淨，所以然燈佛才給我授記並且說我來世必當成佛，名號為釋迦牟尼。為什麼這樣子呢？因為如來這兩個字的含義是如其本來的究竟清淨，因此修行人的內心如果能達到如其本來的究竟清淨才能成佛。假如有人說：『佛陀是得到無上正等正覺之法才成佛的』那就錯了，須菩提！如來對於法是無所執著，一切佛法皆是方便而說、因緣而說，無上正等正覺也是假名而已。須菩提！如來所證悟無上正等正覺的佛心本性，是不著有也不著無的，所以我說一切的法，只要能自悟真如，都可稱之為佛法。但是，須菩提！我所說的一切法，這只是個假名而已，是說給未開悟的人聽，一旦開悟達到究竟清淨，就不需要一切法了。須菩提！譬如有個人的身體高而且大，真的是大身嗎？」須菩提回答世尊說：「您所說的大身，是有生有滅的，仍是有限量的，如何能稱之為大身？不過假藉一個名，稱之為大身而已。」佛又說：「須菩提！菩薩也是如此，真如清淨才能稱為菩薩。而度生本是菩薩份內的事，如果他執著一念，認為我是菩薩，應該滅度一切眾生，便有我相的執著，就不能稱之為菩薩。這是什麼緣故呢？佛又說：須菩提！只有如此清靜的人才能稱為菩薩，沒有對於法的執著，才能稱為菩薩。所以佛說自性中不執著人、我、眾生、壽者四相，真性中空空洞洞，不但無眾生、也無所謂菩薩、可知更無所謂滅渡。須菩提！如果菩薩說：我應當整飾莊嚴佛的剎土，也是著於形相，不可稱之為菩薩。因為這個緣故，佛說莊嚴佛土，非是外貌的莊嚴，只是假借一個名稱，稱之為莊嚴而已。須菩提！若能徹悟人空法空，沒有我的執著，既然沒有我的執著，何來渡眾生與外在莊嚴佛土之心的執著，這樣才能稱得上真正的菩薩。"},{"title":"一體同觀分第十八","original":"「須菩提！於意云何？如來有肉眼不？」「如是，世尊！如來有肉眼。」「須菩提！於意云何？如來有天眼不？」「如是，世尊！如來有天眼。」「須菩提！於意云何？如來有慧眼不？」「如是，世尊！如來有慧眼。」「須菩提！於意云何？如來有法眼不？」「如是，世尊！如來有法眼。」「須菩提！於意云何？如來有佛眼不？」「如是，世尊！如來有佛眼。」「須菩提！於意云何？如恆河中所有沙，佛說是沙不？」「如是，世尊！如來說是沙。」「須菩提！於意云何？如一恆河中所有沙，有如是沙等恆河，是諸恆河所有沙數，佛世界如是，寧為多不？」「甚多。世尊！」佛告須菩提：「爾所國土中，所有眾生若干種心，如來悉知。何以故？如來說諸心，皆為非心，是名為心。所以者何？須菩提！過去心不可得，現在心不可得，未來心不可得。」","translation":"佛說：「須菩提！你認為我有一般人所具有的肉眼嗎？」須若提回答說：「是的，世尊！您具有世俗的肉眼。」佛說：「須菩提！你認為我具有天人所具有，能看到人類肉眼所不能看見東西的天眼嗎？」須菩提回答說：「是的，世尊！您具有天眼。」佛說：「須菩提！你認為我具有自性反觀內照常明，使自己所見一切皆不迷惑的慧眼嗎？」須菩提回答說：「是的，世尊！您具有慧眼。」佛說：「須菩提！你認為我具有洞澈一切萬法以及萬事萬物皆是眾緣合和而成，了解到一切都沒有自主性，只是暫時的假相，所以對一切事物以及萬法不執著的法眼嗎？」須菩提回答說：「是的，世尊！您具有法眼。」佛說：「須菩提！你認為我具有能看到究竟、實在、真正永恆不變真理的佛眼嗎？」須菩提回答說：「是的，世尊！您具有佛眼。」佛又說：「須菩提！你認為在恒河中所有的沙，如來我說那是沙嗎？」須菩提回答世尊說：「是的，您說它是沙。」佛說：「那麼，須菩提！如恒河中所有的沙，如果以其中一粒沙比作一恒河，再以所有恒河中的所有沙，以一粒沙比作一佛世界，你認為這樣的佛世界是不是很多？」須菩提回答世尊說：「非常多」佛告訴須菩提說：「不必遠說到那麼多的佛世界，就拿你所在的國土中，所有眾生的心思，隨情而遷，逐境而生，種種心思顛倒妄想，我卻能以清淨的五眼完全知道。為什麼呢？因為所有這些心思，皆是眾生的妄心，並非本性常住的真心，只是假藉一個名，稱之為心罷了。這又為什麼呢？須菩提！因為人的心思會隨著時空以及環境而變化，而常住的真心事寂然不動的，所以對於過去不會起滯留的心，對於現在不會起執著的心，對於未來也不會起預期的心。"},{"title":"法界通化分第十九","original":"「須菩提！於意云何？若有人滿三千大千世界七寶，以用布施，是人以是因緣，得福多不？」「如是，世尊！此人以是因緣，得福甚多。」「須菩提！若福德有實，如來不說得福德多，以福德無故，如來說得福德多。」","translation":"佛陀繼續說：「須菩提！你的意思怎樣，如果有人用充滿三千大千世界的七寶來行布施，你認為這個人所得的福德是不是很多？」須菩提回答世尊說：「是的，這人用這種因緣布施所得的福德非常多。」佛又說：「須菩提！如果執著福德是實有的，以這種執著福德相所行的布施，他所得的福報，也會因他所施行的因緣有限而會有盡頭的時候，因此如來我說他所得的福德不多，如果他布施的時候，心能夠像虛空般廣大沒有執著，他所得的福德也就能與虛空般廣大相呼應，那麼如來我才說是真福得多。」"},{"title":"離色離相分第二十","original":"「須菩提！於意云何？佛可以具足色身見不？」「不也，世尊！如來不應以具足色身見。何以故？如來說具足色身，即非具足色身，是名具足色身。」「須菩提！於意云何？如來可以具足諸相見不？」「不也，世尊！如來不應以具足諸相見。何以故？如來說諸相具足，即非諸相具足，是名諸相具足。」","translation":"佛又問須菩提說：「你的意思怎樣？佛可以用具足的色身來見到嗎？」須菩提回答世尊說：「如來是不可以用具足的色身來見到的，這是什麼原因呢？因為師父您所說的真正的具足身相指的應該是佛性本體，佛性本體雖然是無形無相，但能成就一切有形的莊嚴色身相。而有形體、可以看得見的具足莊嚴色身相，是會隨因緣而變化的，並不是一個實有的相，此有形體具足莊嚴色身相只是一種假借的名稱而已，不可執著」佛又問須菩提說：「你的意思怎樣？如來可以用具足的諸相來見到嗎？須菩提回答世尊說：「不可以。如來不可以用具足的諸相來見到，為什麼呢？因為一切諸相也是好像我們的色身相一樣會隨因緣而變化，不是一個永恆實有的相。"},{"title":"非說所說分第二十一","original":"「須菩提！汝勿謂如來作是念：我當有所說法。莫作是念！何以故？若人言如來有所說法，即為謗佛，不能解我所說故。須菩提！說法者，無法可說，是名說法。」爾時，慧命須菩提白佛言：「世尊！頗有眾生，於未來世，聞說是法，生信心不？」佛言：「須菩提！彼非眾生，非不眾生。何以故？須菩提！眾生，眾生者，如來說非眾生，是名眾生。」","translation":"佛告訴須菩提說：「你不要以為如來有『我應當或我曾經為眾生說佛法』這樣的念頭，我只是隨順機緣以及悟性來指點大眾，未嘗有過說法的念頭，為什麼呢？如果如來執著有所說法，就表示如來仍拘泥於文字、言說以及法，有所執著當然就不是佛。所以如果有人說『佛陀為眾生說了許多佛法』，那個人就是在毀謗我，不了解我說的真正義理，才會這麼說。須菩提！自性本體是無形無相的、是妙用無窮的，豈能夠用言語表達盡淨，但為了消除眾生的執著迷惑，不得已而說，這樣不執著的心才是真正的說法，所以『說法』這兩個字，只是勉強取的名稱而已。」那時，須菩提向如來佛稟白說：「世尊！恐怕未來世很多眾生，聽到這個對於法不執著的妙理，不知能否生信心。」佛回答須菩提說：「眾生本來各具有佛性，所以說他們不是眾生，但他們尚未解脫妄心，所以他們還是眾生。為什麼呢？須菩提！眾生之所以為眾生是因為尚未了悟，如果能了悟，當下就是佛，而不在是眾生了，所以眾生這只不過是一個假借的名稱而已。」"},{"title":"無法可得分第二十二","original":"須菩提白佛言：「世尊！佛得阿耨多羅三藐三菩提，為無所得耶？」佛言：「如是！如是！須菩提！我於阿耨多羅三藐三菩提，乃至無有少法可得，是名阿耨多羅三藐三菩提。」","translation":"須菩提向如來佛稟問說：「世尊！您對於正等正覺菩提心，以及正等正覺的菩提心法，內心真的是一點得到的念頭都沒有嗎？」佛回答須菩提說：「正是如此！須菩提！因為菩提自性是人人原本就具足，並且圓滿周遍，所以我對於正等正覺菩提心，以及正等正覺菩提心法，絲毫都沒有所得的念頭，這才是真正證悟無上正等正覺的人」。"},{"title":"淨心行善分第二十三","original":"復次：「須菩提！是法平等，無有高下，是名阿耨多羅三藐三菩提。以無我、無人、無眾生、無壽者，修一切善法，則得阿耨多羅三藐三菩提。須菩提！所言善法者，如來說即非善法，是名善法。」","translation":"佛再進一步的向須菩提說明：「我所說的無上正等正覺之法的本體，所指的就是我們得佛性，此佛性在聖不增，在凡不減，並且人人具足，世世相同，所以說是平等。並且佛與眾生沒有高下的不同，所以才稱之為無上正等正覺。用沒有我、人、眾生、壽者等執著之心修一切善法，就可以證悟無上正等正覺。須菩提！如來我所說善法的本體，所指的就是我們的自然妙性，這個自然妙性，原本就沒有善惡對待的執著，只是為了開悟眾生了悟本自具有的佛性的一切法，不得已假借一個名稱，稱他為善法。」"},{"title":"福智無比分第二十四","original":"「須菩提！若三千大千世界中，所有諸須彌山王，如是等七寶聚，有人持用布施。若人以此般若波羅蜜經，乃至四句偈等，受持、讀誦，為他人說，於前福德，百分不及一，百千萬億分，乃至算數譬喻所不能及。」","translation":"佛說：「須菩提！如果有人用七寶堆積起來多得如三千大千世界所有須彌山那麼多來行布施；另外如果有人信受奉行這個般若波羅蜜經，不管是全部，或者是其中一部分，或者少到只以其中的四句偈來為人講說，使自己或他人都能了悟，回歸個人清淨的本體，那麼前者以七寶布施所得的福德比不上後者所得福德的百千萬億分之一，甚至是不能用算數的譬喻所能算的。」因為住相布施所得的福報，就好像是射箭，力道盡了的時後終將墬落。反之能夠深入了悟般若本性，就能夠得到無邊無盡的解脫自在，這個福勝過住相布施所得的福報。"},{"title":"化無所化分第二十五","original":"「須菩提！於意云何？汝等勿謂如來作是念：『我當度眾生。』須菩提！莫作是念！何以故？實無有眾生如來度者。若有眾生如來度者，如來即有我、人、眾生、壽者。須菩提！如來說有我者，則非有我，而凡夫之人，以為有我。須菩提！凡夫者，如來說則非凡夫，是名凡夫。」","translation":"佛問須菩提說：「你的意思怎樣？你們不要認為如來在度化眾生的時候，有『我當下是在度化眾生』這樣的念頭。須菩提！不要有這樣得念頭，為什麼呢？因為眾生的般若妙智慧，與佛並沒有兩樣。眾生能夠由迷轉悟，是眾生的自性自己所渡化，不是靠佛來渡化。如來在渡眾生的時候，如果起了眾生能夠了悟是如來我所度化的念頭，那麼如來我就會因為執著而起了能渡化眾生的我相、被我渡化的人相、所渡化的眾生相、能夠成就的壽者相，那就不是一個已經領悟到自性本體的如來了。須菩提！如來口中所說到這個我字，只是不得已所下的一個代名詞而已，內心實際上沒有這個“我”的執著存在，而在凡夫的境界，則執著我相的存在，以為是我度化他們。須菩提！事實上佛與凡夫本性是相同的，迷則為凡夫，悟則成佛，不過在他們未了悟之時，暫且勉強稱之為凡夫而已。」"},{"title":"法身非相分第二十六","original":"「須菩提！於意云何？可以三十二相觀如來不？」須菩提言：「如是！如是！以三十二相觀如來。」佛言：「須菩提！若以三十二相觀如來者，轉輪聖王即是如來。」須菩提白佛言：「世尊！如我解佛所說義，不應以三十二相觀如來。」爾時，世尊而說偈言：「若以色見我，以音聲求我，是人行邪道，不能見如來。」","translation":"佛問須菩提說：「你的意思怎樣？你認為可以用外在的三十二莊嚴身相，去判斷他是不是佛嗎？」須菩提回答說：「應該可以！應該可以！可以用外在的三十二莊嚴身相，去判斷他是不是佛。」佛因此知道須菩提尚未明白其中的深義，於是說：「須菩提！轉輪聖王，因為福業厚重，所以也具有三十二莊嚴身相，如果可以用外在的三十二莊嚴身相，去判斷是不是佛，那麼你看到轉輪聖王，豈不是也會認為他是佛？」須菩提聽了之後立即明白佛所說的道理，並且回答說：「世尊！我已了解您所說的道理，不應該用外在的三十二莊嚴身相，來判斷他是不是佛。」這個時候，如來看時機已成熟，於是告誡他們離相的偈語：「你們如果執著於外表的形色，或者是執著一切音聲，想要用此二者來證悟我們的真如本性，代表這個人心已外放，向外求法，殊不知佛是須要向心中求，而不是心外求，所以如果有執著向外追求的行為，那便是正路不走，偏走邪路，執著於外在的塵、相、境界，因為有所執著，所以就不能了悟自性如來的本體。"},{"title":"無斷無滅分第二十七","original":"「須菩提！汝若作是念：『如來不以具足相故，得阿耨多羅三藐三菩提。」須菩提！莫作是念：『如來不以具足相故，得阿耨多羅三藐三菩提。』須菩提！汝若作是念，發阿耨多羅三藐三菩提心者，說諸法斷滅。莫作是念！何以故？發阿耨多羅三藐三菩提心者，於法不說斷滅相。』","translation":"佛所說的無相，是教人離一切相，而不是教人滅相，不但心中不執著一切形相，也沒有一個斷滅相的產生。同樣的道理，所謂的無法相的意思，就是不但心中沒有法的執著，也沒有一個法的斷滅相產生。接續上章的法義，佛深恐世人對於相產生斷滅的想法，所以佛告訴須菩提說：「你如果這樣想：如來是因為心中把圓滿的三十二色身相斷滅了的緣故，才得以證得無上菩提，那你就錯了。須菩提！你千萬不可有這種想法，認為如來我心中斷滅了圓滿的三十二色身相才得以證得無上菩提。須菩提！對於一切法也是一樣，雖然一切萬法隨因緣而生滅，如夢幻泡影，修行的人不要對法產生執著，但心中也不要對法有斷滅的念頭產生，為什麼呢？因為發無上正等正覺心的菩薩，必定自覺覺人覺行圓滿，用盡萬法使得眾生內心能夠自我覺悟，怎麼會對於萬法有必須斷滅的想法說詞呢？」"},{"title":"不受不貪分第二十八","original":"「須菩提！若菩薩以滿恆河沙等世界七寶，持用布施。若復有人，知一切法無我，得成於忍。此菩薩勝前菩薩所得功德。何以故？須菩提！以諸菩薩不受福德故。」須菩提白佛言：「世尊！云何菩薩，不受福德？」「須菩提！菩薩所作福德，不應貪著，是故說：不受福德。」","translation":"佛告訴須菩提說：「如果有人行菩薩道的時候，他內心執著於福德，雖然是用積滿了恆河沙數量那麼多世界的七寶拿來布施，所得的福德表面上看起來好像是很多，實際上卻是有限度的。另外如果有人在修菩薩道的時候，同樣是去布施、去弘法，但是他心中不執著功德，更沒有我的意念執著，對於一切欲望與執著內心不需要強忍，而內心自然清淨無染，達到一切『無忍、忘忍』的自在境界。這樣修菩薩道的人所得功德，比起前面所說執著七寶布施所修菩薩道的人，所得的功德還要來得殊聖。這是什麼原因呢？因為一個真正的菩薩，內心是不會受到福德束縛的緣故。須菩提於是問世尊說：「為什麼一個真正的菩薩內心不會受到福德的束縛呢？」佛告訴須菩提說：「菩薩度眾生布施及利益一切眾生，是自性自然流露的行為，所以不會有貪著福德的現象產生，所以才說菩薩不會受到福德的束縛。」"},{"title":"威儀寂靜分第二十九","original":"「須菩提！若有人言：『如來若來、若去；若坐、若臥。』是人不解我所說義。何以故？如來者，無所從來，亦無所去，故名如來。」","translation":"佛告訴須菩提說：「如果有人因為如來我有行、住、坐、臥四種威儀相的緣故，就稱我是如來，或是想在行、住、坐、臥四種威儀中去證悟無相的法身如來，表示這個人心中還是執著於形相，不了解我所說的義理，為什麼呢？因為如來真正所指的是我們的佛性本體，而不是外在的形相。當眾生內心被塵垢遮蔽的時候，非是佛性離去。當覺悟的時候，佛性呈現，這個時候佛性也不是從別處而來。此佛性本體是充滿法界，寂然不動，感而遂通的，所以稱為如來。"},{"title":"一合理相分第三十","original":"「須菩提！若善男子、善女人，以三千大千世界碎為微塵；於意云何？是微塵眾，寧為多不？」須菩提言：「甚多。世尊！何以故？若是微塵眾實有者，佛則不說是微塵眾。所以者何？佛說微塵眾，即非微塵眾，是名微塵眾。世尊！如來所說三千大千世界，則非世界，是名世界。何以故？若世界實有者，即是一合相；如來說一合相，則非一合相，是名一合相。」「須菩提！一合相者，則是不可說，但凡夫之人，貪著其事。」","translation":"佛說：「須菩提！如果有善男子或善女人，將三千大千世界，搗碎成為微塵，你認為這些微塵是不是很多呢？」須菩提回答世尊說：「非常多。為什麼呢？如果眾多微塵是實在永存的實體，佛就不會說是微塵多了﹝眾微塵是因為因緣而來，也一直在隨因緣而變化，而為了分別當下的狀態，不得已把它取名作微塵﹞。這是什麼緣故呢？因為您所說的這些眾微塵，它是隨因緣而生滅變化沒有自主性，只是假藉一個名，稱他是微塵眾。世尊！您所稱的三千大千世界，同樣也是因緣和合的短暫現象，不是真實永久存在，所以假藉一個名，稱它為世界。為什麼呢？倘若說這世界是實有的話，也只不過是許多東西的結合體而已，我們勉強把它稱為一合相，而佛陀您說的一合相，其實只是假藉之名而已，因為凡是有結合就有分散，沒有實在不變的，所以一合相也只是假藉之名而已。佛繼續說：「須菩提！世界是許多東西的結合體，這是不可否認的事實，可是這些結合體之間是一直在變化的、沒有一定的、它時而結合、時而分散，連佛陀我也難以解說，可是世俗的人喜歡談論它，而不知當下它只是變化中一個短暫的現象而已，說來說去又有什麼用，這就是眾生貪戀眼前的事物，所以才會迷失本性啊。」"},{"title":"知見不生分第三十一","original":"「須菩提！若人言：『佛說我見、人見、眾生見、壽者見。』須菩提！於意云何？是人解我所說義不？」「不也，世尊！是人不解如來所說義。何以故？世尊說我見、人見、眾生見、壽者見，即非我見、人見、眾生見、壽者見，是名我見、人見、眾生見、壽者見。」「須菩提！發阿耨多羅三藐三菩提心者，於一切法，應如是知、如是見、如是信解，不生法相。須菩提！所言法相者，如來說即非法相，是名法相。」","translation":"須菩提！如果有人說：佛陀常常講到『我見、人見、眾生見、壽者見』，是不是佛陀內心還有『我見、人見、眾生見、壽者見』的執著存在呢？須菩提！你認為這個人真的了解我所說的義理嗎？」須菩提回答世尊說：不了解的，這個人並不了解您所說的義理。為什麼呢？因為您提到我見、人見、眾生見、壽者見，只是為了便於讓凡夫了解佛的深意而說，事實上佛的內心早已超脫我見、人見、眾生見、壽者見的執著，而我見、人見、眾生見、壽者見只是一個為了教化眾生假藉的名稱而已。佛又說：「須菩提！凡是發無上正等正覺菩提心的人，對於一切佛法，應該有不執著佛法的名相這樣的認知，這樣的相信，這樣的了解。須菩提！為什麼我說要了悟佛法的真義，而不要執著佛法的名相呢？因為一切佛法的名相，就相來說，雖有一切相的假名，但就空寂的自性來說，他是無所執著的。"},{"title":"應化非真分第三十二","original":"「須菩提！若有人以滿無量阿僧祇世界七寶，持用布施。若有善男子、善女人，發菩提心者，持於此經，乃至四句偈等，受持、讀誦，為人演說，其福勝彼。云何為人演說？不取於相，如如不動。何以故？一切有為法，如夢幻泡影；如露亦如電，應作如是觀。」佛說是經已，長老須菩提，及諸比丘、比丘尼、優婆塞、優婆夷，一切世間天、人、阿修羅，聞佛所說，皆大歡喜，信受奉行。","translation":"佛對須菩提說：「如果有人將無窮盡的世界都填滿七寶來行布施。還不如有善男子或善女人，發無上菩提心，信受奉持以及讀誦這整部經典，甚至少到只是信受奉持以及讀誦其中的四句偈等，不但使自己領悟，也使別人領悟佛性，那麼此人因此得到的福德勝過前面所說用填滿無量世界七寶布施的人。為什麼為人演說的時候，內心不但不能對相有所執著，而且內心還要如如不動呢？因為世間，凡是有所為而成的法，都是生滅無常，好像夢一樣的虛幻、好像泡沫和影子一樣的沒有自主性、又有如朝露和電一般的不能長久，你們應該有這樣的體認。」佛反覆闡明般若之法，至此已說解完畢。長老須菩提，與同時在法會聽經的僧人、女尼、善男、信女、及一切世間的天人鬼神等，聽完佛陀所說的般若大法，每個內心都法喜充滿，深信佛陀所說的妙法，並且依照佛陀所說的妙法去修行。"}];
const el=id=>document.getElementById(id); let current=0,pinned=-1,full=localStorage.getItem('diamond-sutra-full-translation')==='true',query='',hoverEnabled=true,scrollMode=false;
function splitSentences(text){const a=text.match(/[^。！？；]+[。！？；]?[」』]?/g)||[text];return a.map(s=>s.trim()).filter(Boolean)}
function splitTranslation(text,minParts){const parts=splitSentences(text);while(parts.length<minParts){let best=-1,cut=-1,score=Infinity;parts.forEach((part,i)=>{for(let p=0;p<part.length;p++)if('，、：'.includes(part[p])){const distance=Math.abs(p-part.length/2);if(part.length>18&&distance<score){best=i;cut=p;score=distance}}});if(best<0)break;const part=parts[best];parts.splice(best,1,part.slice(0,cut+1),part.slice(cut+1))}return parts}
const preciseMappings={'法會因由分第一':[
{original:'如是我聞：一時，佛在舍衛城祇樹給孤獨園，與大比丘眾千二百五十人俱。',translation:'阿難說：這部金剛般若波羅蜜經是阿難我聽如來佛親口所講的，佛在講這部經的時候，是在舍衛城名叫「祈樹給孤獨園」這個地方，當時佛陀與有德性的羅漢、菩薩以及其他弟子，共有一千二百五十人共同聚在一起，'},
{original:'爾時，世尊食時，著衣持缽，入舍衛大城乞食。',translation:'到了快要吃飯的時候，大夥兒就穿上了袈裟，手裏拿著盛飯的缽，由祈樹給孤獨園走到舍衛大城去乞食。'},
{original:'於其城中次第乞已，還至本處。',translation:'在城裏不分富貴貧賤，挨家挨戶的乞食，乞食完畢就回到原來祈樹給孤獨園的地方吃飯。'},
{original:'飯食訖，收衣缽。',translation:'吃完飯，就把袈裟及缽收好，'},
{original:'洗足已，敷座而坐。',translation:'也把腳洗乾淨，再把作位鋪好，然後坐了下來。'}]};
function mapping(ch){if(preciseMappings[ch.title])return preciseMappings[ch.title];const os=splitSentences(ch.original),ts=splitTranslation(ch.translation,os.length);const rows=os.map((s,i)=>{let a=Math.floor(i*ts.length/os.length),b=Math.floor((i+1)*ts.length/os.length);if(b<=a)b=a+1;return{original:s,translation:ts.slice(a,Math.min(b,ts.length)).join('')}});return rows.reduce((groups,row)=>{const last=groups[groups.length-1];if(last&&last.translation===row.translation)last.original+=row.original;else groups.push({...row});return groups},[])}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hi(s){if(!query)return esc(s);return esc(s).split(esc(query)).join('<mark>'+esc(query)+'</mark>')}
function renderNav(){el('nav').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===current))}
function markedTranslation(text,part){const at=text.indexOf(part);if(at<0)return esc(text);return esc(text.slice(0,at))+'<mark>'+esc(part)+'</mark>'+esc(text.slice(at+part.length))}
function show(i){const ch=chapters[current],map=mapping(ch),m=map[i];el('panelTitle').textContent=ch.title;el('quote').textContent=m.original;el('translation').className='translation';el('translation').innerHTML=full?markedTranslation(ch.translation,m.translation):esc(m.translation);el('fullToggle').hidden=false;el('fullToggle').textContent=full?'返回句子對照 ↑':'顯示本分完整白話文 ↓';document.querySelectorAll('.sentence').forEach((x,j)=>x.classList.toggle('active',j===i))}
function tooltip(s,i,event){if(!document.body.classList.contains('explanation-collapsed'))return;const m=mapping(chapters[i])[+s.dataset.i];el('hoverCard').innerHTML='<strong>'+esc(chapters[i].title)+'</strong>'+esc(m.translation);const x=Math.min(event.clientX+18,innerWidth-el('hoverCard').offsetWidth-20),y=Math.min(event.clientY+18,innerHeight-230);el('hoverCard').style.left=Math.max(12,x)+'px';el('hoverCard').style.top=Math.max(74,y)+'px';el('hoverCard').classList.add('visible')}
function hideTooltip(){el('hoverCard').classList.remove('visible')}
function bindSentences(scope=document,i=current){scope.querySelectorAll('.sentence').forEach(s=>{const n=+s.dataset.i;s.addEventListener('mouseenter',e=>{if(i===current&&pinned<0)show(n);if(hoverEnabled)tooltip(s,i,e)});s.addEventListener('mousemove',e=>{if(hoverEnabled&&document.body.classList.contains('explanation-collapsed'))tooltip(s,i,e)});s.addEventListener('mouseleave',()=>{if(hoverEnabled)hideTooltip()});s.addEventListener('focus',()=>{if(i===current&&pinned<0)show(n)});s.addEventListener('click',e=>{if(document.body.classList.contains('explanation-collapsed')){if(!hoverEnabled){el('hoverCard').classList.contains('visible')?hideTooltip():tooltip(s,i,e)}else{pinned=pinned===n?-1:n;tooltip(s,i,e)}return}pinned=pinned===n?-1:n;show(n)})})}
function render(){const ch=chapters[current],map=mapping(ch);el('count').textContent='第 '+String(current+1).padStart(2,'0')+' / 32 分';el('title').innerHTML=hi(ch.title);el('sutra').innerHTML=map.map((m,i)=>'<span class="sentence" tabindex="0" data-i="'+i+'">'+hi(m.original)+'</span>').join('');pinned=-1;hideTooltip();el('panelTitle').textContent=ch.title;el('quote').textContent='';el('translation').className=full?'translation':'translation empty';el('translation').textContent=full?ch.translation:'將游標移到任一句經文，即可在此查看相應的白話解說。';el('fullToggle').hidden=!full;el('fullToggle').textContent=full?'返回句子對照 ↑':'顯示本分完整白話文 ↓';el('prevChapter').disabled=current===0;el('nextChapter').disabled=current===chapters.length-1;renderNav();bindSentences();if(!scrollMode)window.scrollTo({top:0,behavior:'smooth'})}
function go(i){current=Math.max(0,Math.min(chapters.length-1,i));query='';el('search').value='';if(scrollMode){document.getElementById('section-'+current).scrollIntoView({behavior:'smooth'});renderNav()}else render();el('nav').classList.remove('open')}
function renderScroll(){el('scrollReader').innerHTML=chapters.map((ch,ci)=>'<section class="scroll-section" id="section-'+ci+'"><div class="eyebrow">第 '+String(ci+1).padStart(2,'0')+' / 32 分</div><h2>'+hi(ch.title)+'</h2><div class="sutra">'+mapping(ch).map((m,i)=>'<span class="sentence" tabindex="0" data-i="'+i+'">'+hi(m.original)+'</span>').join('')+'</div><div class="scroll-translation">'+hi(ch.translation)+'</div></section>').join('');chapters.forEach((_,i)=>bindSentences(document.getElementById('section-'+i),i))}
function setView(scroll){scrollMode=scroll;document.body.classList.toggle('scroll-view',scroll);el('chapterView').setAttribute('aria-pressed',String(!scroll));el('scrollView').setAttribute('aria-pressed',String(scroll));if(scroll){renderScroll();setTimeout(()=>document.getElementById('section-'+current).scrollIntoView(),0)}else render()}
chapters.forEach((ch,i)=>{const b=document.createElement('button');b.textContent=ch.title;b.onclick=()=>go(i);el('nav').appendChild(b)});
el('menu').onclick=()=>el('nav').classList.toggle('open');
el('fullToggle').onclick=()=>{full=!full;localStorage.setItem('diamond-sutra-full-translation',String(full));show(pinned>=0?pinned:0)};
el('prevChapter').onclick=()=>go(current-1);el('nextChapter').onclick=()=>go(current+1);
el('navToggle').onclick=()=>{const on=document.body.classList.toggle('nav-collapsed');el('navToggle').setAttribute('aria-pressed',String(on));el('navToggle').textContent=on?'顯示目錄':'隱藏目錄'};
el('panelToggle').onclick=()=>{const on=document.body.classList.toggle('explanation-collapsed');el('panelToggle').setAttribute('aria-pressed',String(on));el('panelToggle').textContent=on?'顯示白話':'隱藏白話';hideTooltip()};
el('hoverMode').onclick=()=>{hoverEnabled=!hoverEnabled;el('hoverMode').setAttribute('aria-pressed',String(hoverEnabled));el('hoverMode').textContent=hoverEnabled?'懸停模式':'點擊模式';hideTooltip()};
el('chapterView').onclick=()=>setView(false);el('scrollView').onclick=()=>setView(true);
el('search').addEventListener('input',e=>{query=e.target.value.trim();if(!query){scrollMode?renderScroll():render();return}const idx=chapters.findIndex(ch=>ch.title.includes(query)||ch.original.includes(query)||ch.translation.includes(query));if(idx>=0){current=idx;scrollMode?renderScroll():render();if(scrollMode)setTimeout(()=>document.getElementById('section-'+current).scrollIntoView({behavior:'smooth'}),0)}});
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight')go(current+1);if(e.key.toLowerCase()==='m')el('navToggle').click();if(e.key.toLowerCase()==='e')el('panelToggle').click();if(e.key.toLowerCase()==='v')setView(!scrollMode);if(e.key==='Escape')hideTooltip()});
addEventListener('scroll',()=>{const d=document.documentElement;el('progress').style.width=(d.scrollTop/(d.scrollHeight-d.clientHeight)*100||0)+'%'});
render();
</script>
</body>
</html>
